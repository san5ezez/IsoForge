name: Build IsoForge
on:
  push:
    branches: [ chatgpt, main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore IsoForge/IsoForge.csproj
      - name: Publish Windows x64
        run: dotnet publish IsoForge/IsoForge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/IsoForge-win-x64
      - name: Archive
        run: Compress-Archive -Path artifacts/IsoForge-win-x64/* -DestinationPath artifacts/IsoForge-win-x64.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: IsoForge-win-x64
          path: artifacts/IsoForge-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/IsoForge-win-x64.zip
