name: Build Windows x64 Application

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win64:
    name: Build & Package Windows x64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK (x64)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/UltraISOStudio/UltraISOStudio.csproj -r win-x64

      - name: Build & Publish Self-Contained Windows x64 Single-File EXE
        run: |
          dotnet publish src/UltraISOStudio/UltraISOStudio.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o publish/win-x64

      - name: Verify Built Executable & Run Engine Self-Test
        run: |
          if (!(Test-Path "publish/win-x64/UltraISOStudio.exe")) {
            Write-Error "UltraISOStudio.exe was not generated!"
            exit 1
          }
          Get-Item "publish/win-x64/UltraISOStudio.exe" | Select-Object Name, Length, LastWriteTime
          & "publish/win-x64/UltraISOStudio.exe" --self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Engine self-test failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Create Portable ZIP Archive
        run: |
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "UltraISOStudio-win-x64.zip" -Force

      - name: Upload Build Artifact (EXE & ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: UltraISOStudio-Windows-x64
          path: |
            publish/win-x64/UltraISOStudio.exe
            UltraISOStudio-win-x64.zip
          retention-days: 90

      - name: Create GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/UltraISOStudio.exe
            UltraISOStudio-win-x64.zip
          generate_release_notes: true
